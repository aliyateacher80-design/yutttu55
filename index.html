const cf=$('#cf'),y=cf.getContext('2d');let PT=[],run=0;
function boom(){cf.width=innerWidth;cf.height=innerHeight;for(let n=0;n<180;n++)PT.push({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*14-3,c:CC[n%5],s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,l:140+Math.random()*60});if(!run){run=1;fl()}}
function fl(){y.clearRect(0,0,cf.width,cf.height);PT=PT.filter(p=>p.l>0);PT.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.vx*=.99;p.r+=p.vr;p.l--;y.save();y.translate(p.x,p.y);y.rotate(p.r);y.fillStyle=p.c;y.globalAlpha=Math.min(1,p.l/40);y.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);y.restore()});if(PT.length)requestAnimationFrame(fl);else run=0}
</script></body></html>
